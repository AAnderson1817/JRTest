  - {id: adj-only, where: "A §4.6c", what: "edges resting on an ADJ half and nothing else", says: "87",
     measure: figures.adj_halves, expect: 87, tolerance: 10,
     calibration: "ADJ arises in this build only where erosion left an interval nobody can read, which is Redfern's reading; 87 would need several times the erosion the condition rates produce."}

