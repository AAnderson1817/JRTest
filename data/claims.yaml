# Every figure the A-family states about its own catalogue, and how the verifier measures
# it against the generated corpus (hel/verify.py). Authority C.
#
# expect       the document's figure; `tolerance` for approximate ones ("~", "roughly")
# repaired_to  the figure contradicted the design (arithmetic, definitions, or another
#              figure in the same table); the text now says `now`, and the corpus must
#              reproduce `repaired_to`
# calibration  the figure is feasible under the design and this build's production rates
#              give another number; the note says why, and the document is left alone

claims:
  # ---------------------------------------------------------------- A §2, scale
  - {id: scale-tokens, where: "A §2", what: "catalogued tokens", says: "~4,100", measure: figures.tokens, expect: 4100, tolerance: 150}
  - {id: scale-seq3, where: "A §2", what: "tokens in sequences of three or more units", says: "~2,900",
     measure: tokens_in_sequences_of_3plus_units, expect: 2900, tolerance: 250,
     calibration: "Counted in units (node words, free units, field and log entries). The build writes more one- and two-word records than the design assumed; the definition of a sequence is not fixed anywhere in A."}
  - {id: scale-longest, where: "A §2", what: "longest continuous sequence, in units", says: "41; six exceed 30",
     measure: longest_sequence_units, expect: 41, tolerance: 3,
     calibration: "The build's longest record is a Stratum III field of 21 units. A 41-unit sequence is possible under the design; nothing the build renders is that long."}
  - {id: scale-types, where: "A §2; A-reserve §3.3, §4.2, §4.5", what: "distinct units in the functional strata", says: "~610",
     measure: functional_types, repaired_to: {min: 300, max: 400}, now: "~350", finding: F-15}
  - {id: scale-types-gt5, where: "A §2", what: "functional units occurring more than five times", says: "~180",
     measure: figures.functional_types_gt5, repaired_to: {min: 40, max: 90}, now: "~60, most of them bound formatives", finding: F-15}
  - {id: scale-core, where: "A §2, §6.1c", what: "the analyzable core (roots, ritual units and formatives)", says: "~90",
     measure: analyzable_core, expect: 90, tolerance: 8}
  - {id: core-coda-after, where: "A §6.1c", what: "share of the analyzable core carrying a coda after 1988", says: "71 of 90 (79%)",
     measure: analyzable_core_coda_share, expect: 0.79, tolerance: 0.03}
  - {id: core-coda-1908, where: "A §6.1c", what: "core units carrying a coda under the 1908 Standard", says: "nine of ~90",
     measure: roots_with_coda_1908, expect: "9 of 90",
     calibration: "The build reconstructs the 1908 forms of the 47 roots and ritual units only (3 of 47 had a coda); the formatives' 1908 strings are held in the deprecated register and are not reproduced."}

