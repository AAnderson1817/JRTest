  - id: F-21
    page: false          # author-side: the text would reveal the sealed key
    kind: self
    where: "hel/corpus.py, hel/poetics.py"
    title: "The build filed three texts its own classifier had rejected"
    finds: "The three contested-boundary Stratum III texts were made by splitting one unit in two, and the split left a bare warrant, grade or recurrence formative (nes, lan, kur). The classifier rejected them under Condition 1; the build overrode it and filed them as III."
    repair: "Both halves of a contested split must be unassignable and pass the screen, and the classifier's verdict is final. The three are now 7-unit provisionals, as F-11 says they must be."
  - id: F-22
    page: false          # author-side: the text would reveal the sealed key
    kind: self
    where: "hel/corpus.py, hel/render.py, hel/taphonomy.py"
    title: "The build did not reproduce four figures the documents state exactly"
    finds: "No Ch-1 object carried [41] (A: three). Only 30 intact Ch-1 objects carried -ar (A: more than a hundred). A copyist's h/k swap on a hand copy turned one lartuki-halu into something else (19 became 18), and a fracture stranded a -mun tail (23 became 24)."
    repair: "[41] is placed on three Ch-1 objects, as the sealed placement rule already said; label objects mark junctions; counted records travel on photographic plates; a fracture never strands a -mun tail. All four figures now hold."
  - id: F-25
    kind: self
    where: "hel/diachrony.py"
    title: "Two drafts of the recitation reconstruction were withdrawn by the Algonquian check"
    finds: "The first gave the Common Recitation voiced stops, and its daughters grew -nd-, -mb- and -ng-. The second lost intervocalic /h/, which produced doubled vowels that read as Ojibwe double-vowel spelling, and a word-final -kai that reads as Polynesian."
    repair: "The Common Recitation has /f/ — a labiodental, absent from every Algonquian language — and no cluster, no length, no postalveolar. The check runs on every build."
  - id: F-26
    kind: self
    where: "hel/screen.py; A §6.1f, A-reserve §10"
    title: "The list can spell sh"
    finds: "An s-coda before an h-onset (kas-hi) spells sh, and a reader sees a postalveolar in it — the sound the structural argument against Algonquian resemblance says the profile excludes. No core unit does it; 25 forms coined by the first Phase 2 build did."
    repair: "The structural screen rejects the junction, and doubled vowels, in every coinage. It holds no Indigenous word list and builds none; a lexical screen is work for a reviewer with community-sanctioned resources, recorded as a gap."
  - id: F-27
    kind: self
    where: "hel/diachrony.py"
    title: "The regular Second-branch form of the closure marker is sin"
    finds: "Raising unstressed e gives sin for -sen FRB — an English word that supplies exactly the forbidder the Archive's residue warns about. The collision screen caught it."
    repair: "An irregular with a stated cause: the Second branch says sen. Pellingham (1953) filed it as the branch's one exception — crews heard 'forbidden' in sin and did not say it."
  - id: F-28
    kind: doc
    where: "A §7 (against A-reserve §3.3)"
    title: "Forty percent or two-thirds"
    says: "Stratum III “contains ~40% of the corpus's hapax units.”"
    finds: "The reserve, which A names as the full specification, said about two-thirds (301 of ~450); with its table corrected (F-10) the engine gets 70%."
    repair: "“About seven in ten” — the reserve's own figure once F-10 corrected its inputs."
  - id: F-29
    kind: self
    where: "data/core.yaml, data/field_english.yaml, sealed/key.yaml"
    title: "Four of this build's own coinages collided with something"
    finds: "The ritual unit ropelki contained the brand Opel (and the English rope); the root hitulsa contained Tulsa; two invented scholars shared names with a famous actor and a novel's family. And the Field English reduction of nikur, [ˈnɪkəɹ], sat one voicing feature from an English slur."
    repair: "ropelki is now rosilpe (still four units with Chicago p against Second f), hitulsa is hitulke, the scholars are Treloar (1926) and Tredgold (1967), and nikur keeps its Standard stress in the field — the one loan that never reduces."
  - id: F-30
    page: false          # author-side: the text would reveal the sealed key
    kind: self
    where: "hel/corpus.py, data/formulae.yaml (sealed P-41, P-RITUAL); critique/B1"
    title: "Two things with no meaning had patterns a reader could read"
    finds: "The blind trial found that [41] occurred in writing only on closure records (three of three, p ≈ 5×10⁻⁵), and two readers took it for a closure warrant; and that the ritual unit before [41] co-varied with polarity. Both are placed by rules with no truth value, and the handbook says [41] must never be explained. The patterns were accidents of placement."
    repair: "[41] sits on records of three unrelated kinds with no polarity, drawn from a separate random stream; two formulae swap ritual units, so each ends formulae of mixed polarity."
  - id: F-31
    page: false          # author-side: the text would reveal the sealed key
    kind: self
    where: "sealed/key.yaml WITHHOLDING; hel/render.py; critique/B1"
    title: "The sealed key promised nine bound pairs the build never rendered"
    finds: "All three trial readers re-ran Keele's method on the break inventory and found no further frozen pairs. The key says nine are there. They were not: a withholding entry with nothing behind it."
    repair: "The nine are listed in the key's TRUTH register and rendered, two of each, bare and where their condition holds. Keele's method now finds them."
  - id: F-32
    kind: self
    where: "hel/grammar.py, reading_room/engine.js, hel/corpus.py; critique/B1"
    title: "The engine filed the Archive's own identifications as damage"
    finds: "The catalogue flagged kalsira-ru, lartuki-halu and the half-negated tails D-BROKEN — sixty years after Keele — so 66 of 101 broken halves were constructions the Archive had identified. And eight glossed roots never occurred in the catalogue at all, though a gloss graded by operational correlation needs records to rest on."
    repair: "Identified constructions are catalogued as N-PAIR and N-HALFNEG notes, and the figures split broken halves into constructions and the rest; every glossed root now occurs in the catalogue."

